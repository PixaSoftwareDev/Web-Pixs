<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

    <meta name="robots" content="noindex, nofollow" />

    <style>
      @font-face {
        font-family: "General Sans";
        src: url("./fonts/GeneralSans-Light.woff2") format("woff2");
        font-weight: 300; font-display: swap;
      }
      @font-face {
        font-family: "General Sans";
        src: url("./fonts/GeneralSans-Medium.woff2") format("woff2");
        font-weight: 500; font-display: swap;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100svh; display: flex; align-items: center; justify-content: center;
        padding: 32px; background: #0f0f0f; color: #fff;
        font-family: "General Sans", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .halo {
        position: fixed; inset: -30%; pointer-events: none;
        background:
          radial-gradient(38% 32% at 30% 26%, rgba(96, 216, 240, 0.16), transparent 72%),
          radial-gradient(36% 32% at 72% 74%, rgba(132, 88, 248, 0.15), transparent 74%);
      }
      main { position: relative; width: 100%; max-width: 560px; }
      .logo { height: 34px; width: auto; }
      h1 {
        margin-top: 44px; font-size: clamp(34px, 7vw, 52px); font-weight: 500;
        line-height: 1.02; letter-spacing: -0.03em;
      }
      p {
        margin-top: 20px; max-width: 460px; font-size: clamp(16px, 2.4vw, 19px);
        font-weight: 300; line-height: 1.5; letter-spacing: -0.01em; color: rgba(255, 255, 255, 0.6);
      }
      .acciones { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 12px; }
      a {
        display: inline-flex; align-items: center; padding: 14px 26px; border-radius: 999px;
        font-size: 15px; font-weight: 500; letter-spacing: -0.01em; text-decoration: none;
        transition: background-color .2s ease, border-color .2s ease;
      }
      .primario { background: #fff; color: #0f0f0f; }
      .primario:hover { background: rgba(255, 255, 255, 0.86); }
      .secundario { border: 1px solid rgba(255, 255, 255, 0.18); color: #fff; }
      .secundario:hover { border-color: rgba(255, 255, 255, 0.38); background: rgba(255, 255, 255, 0.05); }
      footer { margin-top: 56px; font-size: 14px; color: rgba(255, 255, 255, 0.4); }
    </style>
  </head>
  <body>
    <div class="halo"></div>

      </p>
      <div class="acciones">

        <a class="secundario" href="mailto:hola@intellix.com.ar">hola@intellix.com.ar</a>
      </div>
