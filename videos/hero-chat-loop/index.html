<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=900" />
    <title>hero-chat-loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 720px;
        height: 900px;
        overflow: hidden;
        background: #efeae2;
      }
      #root {
        position: relative;
        width: 720px;
        height: 900px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="720"
      data-height="900"
    >
      <div
        id="hero-chat-loop-host"
        class="clip"
        data-composition-id="hero-chat-loop"
        data-composition-src="compositions/index.html"
        data-start="0"
        data-duration="10"
        data-track-index="1"
        data-width="720"
        data-height="900"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
