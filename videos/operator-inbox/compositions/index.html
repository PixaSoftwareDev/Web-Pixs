      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var tl = gsap.timeline({ paused: true });

          // helper: fromTo with immediateRender:false always
          function FT(target, from, to, pos) {
            to.immediateRender = false;
            tl.fromTo(target, from, to, pos);
          }

          // ---- live dot pulse: period 2s x 5 exact cycles (0..10s, closes the loop)
          for (var c = 0; c < 5; c++) {
            FT("#oi-live-dot", { opacity: 1 }, { opacity: 0.45, duration: 1, ease: "sine.inOut" }, c * 2);
            FT("#oi-live-dot", { opacity: 0.45 }, { opacity: 1, duration: 1, ease: "sine.inOut" }, c * 2 + 1);
          }

          // ---- beat: toast-in (1.2 - 1.75)
          FT("#oi-toast", { y: -90, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.55, ease: "back.out(1.4)" }, 1.2);

          // ---- beat: row-insert (2.0 - 2.55)
          FT(
            "#oi-row-marina",
            { autoAlpha: 0, y: -18, scale: 0.97 },
            { autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)", transformOrigin: "top center" },
            2.0
          );
          FT("#oi-rows-shift", { y: 0 }, { y: 88, duration: 0.5, ease: "back.out(1.2)" }, 2.0);

          // ---- beat: insert-pulse (2.2 - 3.2), single pulse
          FT("#oi-flash", { opacity: 0 }, { opacity: 0.55, duration: 0.35, ease: "power2.out" }, 2.2);
          FT("#oi-flash", { opacity: 0.55 }, { opacity: 0, duration: 0.65, ease: "power2.inOut" }, 2.55);

          // ---- beat: toast-out (3.2 - 3.6)
          FT("#oi-toast", { y: 0, autoAlpha: 1 }, { y: -90, autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 3.2);

          // ---- beat: take-press (4.2 - 4.5)
          FT("#oi-take", { scale: 1 }, { scale: 0.92, duration: 0.12, ease: "power2.in", transformOrigin: "center center" }, 4.2);
          FT("#oi-take", { scale: 0.92 }, { scale: 1, duration: 0.18, ease: "back.out(2.5)", transformOrigin: "center center" }, 4.32);

          // ---- beat: take-swap (4.5 - 4.85), 0.08s overlap
          FT("#oi-take", { autoAlpha: 1, scale: 1 }, { autoAlpha: 0, scale: 0.9, duration: 0.2, ease: "power2.in", transformOrigin: "center center" }, 4.5);
          FT("#oi-vos", { autoAlpha: 0, scale: 0.92 }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)", transformOrigin: "center center" }, 4.62);

          // tab counters crossfade at 4.55: (1)->(0) and (2)->(3)
          FT("#oi-ctr1-a", { autoAlpha: 1, y: 0 }, { autoAlpha: 0, y: -6, duration: 0.22, ease: "power2.in" }, 4.55);
          FT("#oi-ctr1-b", { autoAlpha: 0, y: 6 }, { autoAlpha: 1, y: 0, duration: 0.22, ease: "power2.out" }, 4.55);
          FT("#oi-ctr2-a", { autoAlpha: 1, y: 0 }, { autoAlpha: 0, y: -6, duration: 0.22, ease: "power2.in" }, 4.55);
          FT("#oi-ctr2-b", { autoAlpha: 0, y: 6 }, { autoAlpha: 1, y: 0, duration: 0.22, ease: "power2.out" }, 4.55);

          // ---- beat: hold-breathe (5.2 - 8.2): left bar breathes, opacity only
          FT("#oi-leftbar", { opacity: 0 }, { opacity: 0.9, duration: 0.5, ease: "power2.out" }, 5.2);
          FT("#oi-leftbar", { opacity: 0.9 }, { opacity: 0.5, duration: 0.625, ease: "sine.inOut" }, 5.7);
          FT("#oi-leftbar", { opacity: 0.5 }, { opacity: 0.9, duration: 0.625, ease: "sine.inOut" }, 6.325);
          FT("#oi-leftbar", { opacity: 0.9 }, { opacity: 0.5, duration: 0.625, ease: "sine.inOut" }, 6.95);
          FT("#oi-leftbar", { opacity: 0.5 }, { opacity: 0.9, duration: 0.625, ease: "sine.inOut" }, 7.575);

          // ---- beat: reset-fade (8.2 - 9.4)
