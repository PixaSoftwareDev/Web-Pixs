<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=760" />
    <title>operator-inbox</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1440px;
        height: 760px;
        overflow: hidden;
        background: #fafafa;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        position: relative;
        width: 1440px;
        height: 760px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1440"
      data-height="760"
    >
      <div
        id="operator-inbox"
        class="clip"
        data-composition-id="operator-inbox"
        data-composition-src="compositions/index.html"
        data-start="0"
        data-duration="10"
        data-track-index="1"
        data-width="1440"
        data-height="760"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
