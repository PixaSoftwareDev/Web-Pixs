      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var q = function (sel) {

          var stack = q("#hc-stack");
          var rows = [q("#hc-m1"), q("#hc-m2"), q("#hc-m3"), q("#hc-m4"), q("#hc-m5")];
          var ind1 = q("#hc-typing1");
          var ind2 = q("#hc-typing2");
          var GAP = 14;
          var ANCHOR = 806; // bottom edge of the message stack (canvas y)
          var H_IND = 44;

          // ---- static layout (measured once, deterministic: system fonts, fixed canvas) ----
          var H = stack.offsetHeight; // full conversation height (all rows in flow)
          stack.style.top = ANCHOR - H + "px";
          var h = rows.map(function (r) {
            return r.offsetHeight;
          });
          // typing indicators overlay the reply slots (m3 / m5)
          ind1.style.top = rows[2].offsetTop + "px";
          ind2.style.top = rows[4].offsetTop + "px";

          // translateY states of the stack (0 = full conversation, bottom = ANCHOR)
          var yRest = H - h[0]; // only m1 visible
          var yA = yRest - (GAP + h[1]); // + m2
          var yB = yA - (GAP + H_IND); // + typing 1
          var yC = yA - (GAP + h[2]); // + m3
          var yD = yC - (GAP + h[3]); // + m4
          var yE = yD - (GAP + H_IND); // + typing 2

          gsap.set(stack, { y: yRest });

          var tl = gsap.timeline({ paused: true });

          function typewriter(proxy, textEl, full, t0, dur) {
            tl.fromTo(
              proxy,
              { n: 0 },
              {
                n: full.length,
                duration: dur,
                ease: "none",
                immediateRender: false,
                onUpdate: function () {
                  textEl.textContent = full.slice(0, Math.round(proxy.n));

              },

            );
          }

          function caretBlink(caret, t0, t1) {
            var on = true;
            for (var t = t0; t < t1 - 0.02; t += 0.265) {
              tl.set(caret, { opacity: on ? 1 : 0 }, t);
              on = !on;
            }
            tl.set(caret, { opacity: 0 }, t1);
          }

          function sendPulse(t0) {
            var btn = "#hc-send";
            tl.fromTo(btn, { scale: 1 }, { scale: 1.15, duration: 0.08, ease: "power2.out", immediateRender: false }, t0);
            tl.fromTo(btn, { scale: 1.15 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, t0 + 0.08);
          }

          function activatePulse(t0) {
            var btn = "#hc-send";
            tl.fromTo(btn, { scale: 1 }, { scale: 1.06, duration: 0.1, ease: "sine.out", immediateRender: false }, t0);
            tl.fromTo(btn, { scale: 1.06 }, { scale: 1, duration: 0.1, ease: "sine.in", immediateRender: false }, t0 + 0.1);
          }

          function dotsBounce(sel, t0) {
            var dots = document.querySelectorAll(sel);
            for (var i = 0; i < dots.length; i++) {
              tl.fromTo(
                dots[i],
                { y: 0 },
                { y: -5, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false },
                t0 + i * 0.14
              );
            }
          }

          // ---- beat: type-q1 (0.6 - 1.7) ------------------------------------
          tl.fromTo("#hc-placeholder", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power1.out", immediateRender: false }, 0.6);
          tl.fromTo("#hc-typed-g1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, ease: "none", immediateRender: false }, 0.58);
          typewriter({ n: 0 }, q("#hc-typed-t1"), Q1, 0.6, 1.1);
          caretBlink("#hc-caret1", 0.6, 1.7);
          activatePulse(1.5);

          // ---- beat: send-q1 (1.7 - 2.1) ------------------------------------

          dotsBounce(".hc-t1-dot", 2.3);

          // ---- beat: reply-1 (3.4 - 3.85) -----------------------------------
          tl.fromTo(ind1, { autoAlpha: 1, scale: 1 }, { autoAlpha: 0, scale: 0.9, duration: 0.18, ease: "power2.in", transformOrigin: "bottom left", immediateRender: false }, 3.4);
          tl.fromTo(

          tl.fromTo("#hc-typed-g2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, ease: "none", immediateRender: false }, 4.88);
