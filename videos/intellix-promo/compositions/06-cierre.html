<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>06 cierre</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          font-weight: 500;
          font-style: normal;
          src: url("assets/fonts/space-grotesk-500.woff2") format("woff2");
        }
        @font-face {
          font-family: "Space Grotesk";
          font-weight: 700;
          font-style: normal;
          src: url("assets/fonts/space-grotesk-700.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          width: 1440px;
          height: 900px;
          overflow: hidden;
          background: #fcfcfd;
          font-family: "Space Grotesk", system-ui, sans-serif;
          color: #1e2434;
        }
        .f-glow {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 780px;
          height: 780px;
          margin: -390px 0 0 -390px;
          border-radius: 999px;
          background: radial-gradient(
            circle,
            rgba(47, 107, 240, 0.12) 0%,
            rgba(124, 77, 234, 0.08) 40%,
            transparent 70%
          );
          filter: blur(40px);
          opacity: 0;
          will-change: transform;
        }
        .f-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .f-beat {
          position: absolute;
          font-size: 96px;
          font-weight: 700;
          letter-spacing: -0.02em;
          opacity: 0;
          will-change: transform;
          white-space: nowrap;
        }
        .f-beat em {
          font-style: normal;
          background: linear-gradient(100deg, #2f6bf0, #7c4dea);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
        .f-lockup {
          position: absolute;
          display: flex;
          align-items: center;
          gap: 30px;
        }
        .f-icon {
          width: 150px;
          height: 150px;
          object-fit: contain;
          opacity: 0;
          will-change: transform;
        }
        .f-letters-mask {
          overflow: hidden;
          height: 96px;
          display: flex;
          align-items: center;
        }
        .f-letters {
          height: 74px;
          width: auto;
          will-change: transform;
        }
        .f-url {
          position: absolute;
          left: 0;
          right: 0;
          top: 596px;
          text-align: center;
          font-size: 30px;
          font-weight: 500;
          color: #656e82;
          letter-spacing: 0.02em;
          opacity: 0;
          will-change: transform;
        }
      </style>

      <div data-hf-id="hf-kjqd" id="root" data-composition-id="06-cierre" data-width="1440" data-height="900">
        <div data-hf-id="hf-4qtn" class="f-glow" id="fGlow"></div>

        <div data-hf-id="hf-q34n" class="f-stage">
          <div data-hf-id="hf-prb2" class="f-beat" id="fb1">Tus <em data-hf-id="hf-arfa">documentos.</em></div>
          <div data-hf-id="hf-43wz" class="f-beat" id="fb2">Tus <em data-hf-id="hf-duhm">respuestas.</em></div>
          <div data-hf-id="hf-hvzb" class="f-beat" id="fb3">Tu <em data-hf-id="hf-q199">marca.</em></div>

          <div data-hf-id="hf-dxnp" class="f-lockup" id="lockup">
            <img data-hf-id="hf-cs57" class="f-icon" id="fIcon" src="assets/icon.png" alt="Intellix">
            <div data-hf-id="hf-yiaj" class="f-letters-mask">
              <img data-hf-id="hf-leqa" class="f-letters" id="fLetters" src="assets/letters-on-light.png" alt="INTELLIX">
            </div>
          </div>
        </div>

        <div data-hf-id="hf-q1no" class="f-url" id="fUrl">intellix.com.ar</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          const tl = gsap.timeline({ paused: true });

          // Tres beats secos, cada uno con su propio pop
          const beats = [
            { id: "#fb1", t: 0.25 },
            { id: "#fb2", t: 1.55 },
            { id: "#fb3", t: 2.85 },
          ];
          beats.forEach(function (b) {
            tl.fromTo(b.id, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.9)" }, b.t);
            tl.to(b.id, { opacity: 0, scale: 1.08, duration: 0.32, ease: "power2.in" }, b.t + 1.0);
          });

          // Glow florece en el vacío
          tl.fromTo("#fGlow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" }, 4.2);
          // Respiración del glow durante el hold (finita)
          tl.fromTo("#fGlow", { scale: 1 }, { scale: 1.06, duration: 1.9, ease: "sine.inOut", repeat: 1, yoyo: true, immediateRender: false }, 5.6);

          // El isotipo hace spring-bloom desde cero con un giro sutil
          tl.fromTo(
            "#fIcon",
            { opacity: 0, scale: 0, rotation: -14 },
            { opacity: 1, scale: 1, rotation: 0, duration: 0.85, ease: "back.out(1.7)" },
            4.55
          );

          // Las letras se revelan deslizando desde atrás del isotipo
          tl.fromTo("#fLetters", { xPercent: -104, opacity: 0 }, { xPercent: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 5.35);

          // URL debajo
          tl.fromTo("#fUrl", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.3);

          // Hold largo: micro-escala casi imperceptible en el lockup
          tl.fromTo("#lockup", { scale: 1 }, { scale: 1.025, duration: 3.4, ease: "sine.inOut", immediateRender: false }, 6.6);

          window.__timelines["06-cierre"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
