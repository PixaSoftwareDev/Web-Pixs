      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          const tl = gsap.timeline({ paused: true });

          // Cámara: un solo estado, un solo escritor.
          // Encuadre A: chat centrado → world x = 720 - (300+760/2)= centrar 680 en 720 → x = 40
          // Encuadre B: bandeja centrada → centro bandeja = 1860 → x = 720 - 1860 = -1140
          const cam = { x: 40, y: 0, s: 1.06 };
          const apply = function () {
            const w = document.getElementById("world");
            if (w) w.style.transform = "translate(" + cam.x + "px," + cam.y + "px) scale(" + cam.s + ")";
          };
          apply();

          tl.fromTo("#dGlow", { x: 0 }, { x: -60, duration: 6, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

          // Acto 1: en el chat
          tl.fromTo("#dUser", { opacity: 0, y: 16, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.5);
          tl.fromTo("#dBot", { opacity: 0, y: 16, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 1.5);
          tl.fromTo("#dChip", { opacity: 0, y: 12, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 2.5);

          // Viaje: swoop del mundo hacia la bandeja (leg motivado por la derivación)
          tl.fromTo(cam, { x: 40, s: 1.06 }, { x: -1140, s: 1.0, duration: 1.5, ease: "power3.inOut", immediateRender: false, onUpdate: apply }, 3.6);

          // La bandeja reacciona: notificación + campanita + fila nueva
          tl.fromTo("#notif", { opacity: 0, y: -18, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 5.3);
          tl.fromTo("#bellDot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, 5.4);
          tl.fromTo("#hotRow", { opacity: 0, y: -22, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 5.9);
          // Ring pulse alrededor de la fila (dos pulsos finitos)
          tl.fromTo("#hotRing", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.04, duration: 0.9, ease: "power2.out", repeat: 1 }, 6.2);
          tl.to("#notif", { opacity: 0, y: -14, duration: 0.4, ease: "power2.in" }, 7.6);

          // El operador la toma: Esperando → Activa
          tl.fromTo("#bWait", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.9, duration: 0.3, ease: "power2.in" }, 8.6);
          tl.fromTo("#bActive", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 8.8);

          // Frase
          tl.fromTo(".dw", { yPercent: 115 }, { yPercent: 0, duration: 0.6, ease: "power4.out", stagger: 0.07 }, 9.2);

          // Micro push-in final para que el hold no muera
          tl.fromTo(cam, { s: 1.0 }, { s: 1.03, duration: 2.0, ease: "sine.inOut", immediateRender: false, onUpdate: apply }, 9.8);

          window.__timelines["04-derivacion"] = tl;
        })();
      </script>
