      <div data-hf-id="hf-eu6k" id="root" data-composition-id="02-chat-web" data-width="1440" data-height="900">
        <div data-hf-id="hf-lc8n" class="c-glow c-glow-a" id="cGlowA"></div>
        <div data-hf-id="hf-wton" class="c-glow c-glow-b" id="cGlowB"></div>

        <div data-hf-id="hf-f4n2" class="c-card" id="card">
          <div data-hf-id="hf-cx0q" class="c-head">
            <div data-hf-id="hf-bbgi" class="c-ava"><img data-hf-id="hf-2rc0" src="assets/icon.png" alt=""></div>
            <div data-hf-id="hf-yeow">

              <div data-hf-id="hf-2cg7" class="c-head-status"><span data-hf-id="hf-vjvm" class="c-dot"></span> En línea</div>
            </div>
          </div>
          <div data-hf-id="hf-7q4e" class="c-msgs">
            <div data-hf-id="hf-el5y" class="c-bubble c-user" id="mUser" style="opacity: 0">
              ¿Hacen envíos al interior? ¿Cuánto demoran?
            </div>
            <div data-hf-id="hf-wkg0" class="c-slot">
              <div data-hf-id="hf-rjeq" class="c-typing" id="typing">
                <span data-hf-id="hf-nnvn" id="td1"></span><span data-hf-id="hf-ezzs" id="td2"></span><span data-hf-id="hf-frnl" id="td3"></span>
              </div>
              <div data-hf-id="hf-1lzr" class="c-bubble c-bot" id="mBot1" style="opacity: 0">
                ¡Sí! Hacemos envíos a todo el país 🚚
              </div>
            </div>
            <div data-hf-id="hf-7dh8" class="c-bubble c-bot" id="mBot2" style="opacity: 0">
              Al interior demoran de 3 a 5 días hábiles, y desde $80.000 el envío es gratis.
            </div>
            <div data-hf-id="hf-gz6b" class="c-source" id="source">

                <path data-hf-id="hf-e4lr" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />

        <div data-hf-id="hf-ka9a" class="c-phrase" id="phrase">
          <span data-hf-id="hf-vjbs" class="p-mask"><span data-hf-id="hf-ss4r" class="p-word pw">Responde</span></span>

      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          const tl = gsap.timeline({ paused: true });
          const Q = "¿Hacen envíos al interior? ¿Cuánto demoran?";

          // Glows ambiente
          tl.fromTo("#cGlowA", { x: 0, y: 0 }, { x: 46, y: 26, duration: 6, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
          tl.fromTo("#cGlowB", { x: 0, y: 0 }, { x: -40, y: -22, duration: 6, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

          // Card entra
          tl.fromTo("#card", { opacity: 0, scale: 0.94, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);

          // Tipeo en el input (secuencia discreta, seek-safe)
          const typing = { n: 0 };
          tl.to(typing, {
            n: Q.length,
            duration: 2.1,
            ease: "none",
            onUpdate: function () {
              const el = document.getElementById("typed");
              if (el) el.textContent = Q.slice(0, Math.round(typing.n));
            },
          }, 0.9);
          // Caret parpadea (finito)
          tl.fromTo("#caret", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "steps(1)", repeat: 7, yoyo: true }, 0.9);

          // Enviar: dip del botón + burbuja del usuario + input se limpia
          tl.fromTo("#send", { scale: 1 }, { scale: 0.85, duration: 0.1, ease: "power2.in" }, 3.15);
          tl.to("#send", { scale: 1, duration: 0.25, ease: "back.out(3)" }, 3.25);
          tl.set("#typed", { textContent: "" }, 3.3);
          tl.set("#caret", { opacity: 0 }, 3.3);
          tl.set("#ph", { display: "inline" }, 3.3);
          tl.fromTo("#mUser", { opacity: 0, y: 16, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 3.3);

          // "Escribiendo…" — dots
          tl.fromTo("#typing", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 3.9);
          for (let i = 1; i <= 3; i++) {
            tl.fromTo(
              "#td" + i,
              { y: 0, opacity: 0.4 },
              { y: -5, opacity: 1, duration: 0.32, ease: "sine.inOut", repeat: 3, yoyo: true },
              4.0 + i * 0.13
            );
          }
          tl.to("#typing", { opacity: 0, duration: 0.18 }, 5.35);

          // Respuesta en dos bloques
          tl.fromTo("#mBot1", { opacity: 0, y: 16, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 5.6);
          tl.fromTo("#mBot2", { opacity: 0, y: 16, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 6.35);

          // Chip de fuente + badge de velocidad
          tl.fromTo("#source", { opacity: 0, y: 12, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 7.2);
          tl.fromTo("#badge", { opacity: 0, x: -14, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 7.7);

          // Frase de cierre de la escena
          tl.fromTo(".pw", { yPercent: 115 }, { yPercent: 0, duration: 0.6, ease: "power4.out", stagger: 0.08 }, 8.5);

          // Micro-drift de la card para que el hold respire
          tl.fromTo("#card", { y: 0 }, { y: -6, duration: 1.6, ease: "sine.inOut", repeat: 1, yoyo: true, immediateRender: false }, 9.0);

          window.__timelines["02-chat-web"] = tl;
        })();
      </script>
